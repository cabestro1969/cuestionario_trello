<header class="top">
  <div class="brand">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="#142133"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div>
    <div><h1>Laboratorio virtual de electricidad</h1><small>IES Comuneros de Castilla · Departamento de Tecnología · Montajes eléctricos (ejercicios 1–20)</small></div>
  </div>
  <nav class="tabs" id="nav"></nav>

<main id="main" style="max-width:1100px"></main>
<footer>IES Comuneros de Castilla · Departamento de Tecnología · Los datos se guardan solo en este navegador.</footer>
<script>
'use strict';
const INK='#1d2b3a',SNAP=20,MOTOR_R=20,K_RPM=100,LAMP_P0=2.7;
const TYPES={
  pila:{name:'Pila',unit:'V',def:9},
  lampara:{name:'Lámpara',def:30},
  motor:{name:'Motor',def:20},
  interruptor:{name:'Interruptor',def:0},
  pulsadorNA:{name:'Pulsador',def:0},
  conmutador:{name:'Conmutador',def:0},
  conmutador2:{name:'Conmutador doble',def:0}
};
const TERM={
  def:{a:[-40,0],b:[40,0]},
  conmutador:{c:[-40,0],'0':[40,-20],'1':[40,20]},
  conmutador2:{c1:[-40,-40],'0a':[40,-60],'1a':[40,-20],c2:[-40,40],'0b':[40,20],'1b':[40,60]}
};
const HH={conmutador:40,conmutador2:78};
const fmtNum=v=>String(Math.round(+v*1000)/1000).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseNum(s){const m=/^\s*(-?[\d.,]+)\s*(rpm)?\s*$/i.exec(String(s||''));return m?parseFloat(m[1].replace(',','.')):NaN;}
const rotVec=(x,y,r)=>{switch(((r%360)+360)%360){case 90:return[-y,x];case 180:return[-x,-y];case 270:return[y,-x];default:return[x,y];}};
const tmap=c=>TERM[c.type]||TERM.def;
function termPos(c,t){const L=tmap(c)[t],v=rotVec(L[0],L[1],c.rot||0);return{x:c.x+v[0],y:c.y+v[1]};}
function termDir(c,t){const L=tmap(c)[t],v=rotVec(L[0]<0?-1:1,0,c.rot||0);return{x:v[0],y:v[1]};}
const parseKey=k=>{const i=k.indexOf('.');return{id:+k.slice(0,i),t:k.slice(i+1)};};
const getComp=(b,id)=>b.comps.find(c=>c.id===id);
const newBoard=()=>({comps:[],wires:[],nid:1});
function wirePts(b,w){
  const A=parseKey(w.a),B=parseKey(w.b),ca=getComp(b,A.id),cb=getComp(b,B.id);
  if(!ca||!cb||!tmap(ca)[A.t]||!tmap(cb)[B.t])return null;
  const p=termPos(ca,A.t),q=termPos(cb,B.t),dp=termDir(ca,A.t),dq=termDir(cb,B.t),St=20;
  const p1={x:p.x+dp.x*St,y:p.y+dp.y*St},q1={x:q.x+dq.x*St,y:q.y+dq.y*St};
  const mid=dp.x!==0?{x:p1.x,y:q1.y}:{x:q1.x,y:p1.y};
  return[p,p1,mid,q1,q];
}
function gauss(A,z){
  const n=z.length;
  for(let i=0;i<n;i++){
    let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    if(Math.abs(A[p][i])<1e-30)return null;
    if(p!==i){[A[p],A[i]]=[A[i],A[p]];[z[p],z[i]]=[z[i],z[p]];}
    for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];if(f===0)continue;for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];z[r]-=f*z[i];}
  }
  const x=new Float64Array(n);
  for(let i=n-1;i>=0;i--){let s=z[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}
  return x;
}
/* Simulador: varios circuitos independientes en una misma hoja (cada uno con su referencia) */
function sim1(b){
  const par=[],gp=[],idx=new Map();
  const gi=k=>{if(!idx.has(k)){idx.set(k,par.length);par.push(par.length);gp.push(gp.length);}return idx.get(k);};
  const fd=(a,i)=>{while(a[i]!==i){a[i]=a[a[i]];i=a[i];}return i;};
  const un=(a,x,y)=>{x=fd(a,x);y=fd(a,y);if(x!==y)a[x]=y;};
  b.comps.forEach(c=>Object.keys(tmap(c)).forEach(t=>gi(c.id+'.'+t)));
  const K=(c,t)=>idx.get(c.id+'.'+t);
  b.wires.forEach(w=>{if(idx.has(w.a)&&idx.has(w.b)){un(par,idx.get(w.a),idx.get(w.b));un(gp,idx.get(w.a),idx.get(w.b));}});
  const els=[];
  const add=(c,a,bb,g,e)=>{els.push({c,a:K(c,a),b:K(c,bb),g,E:e});un(gp,K(c,a),K(c,bb));};
  b.comps.forEach(c=>{
    switch(c.type){
      case 'pila':add(c,'a','b',1e4,+c.value);break;
      case 'lampara':add(c,'a','b',c.burnt?1e-9:1/Math.max(+c.value||30,1e-6),null);break;
      case 'motor':add(c,'a','b',1/MOTOR_R,null);break;
      case 'interruptor':add(c,'a','b',c.closed?1e6:1e-12,null);break;
      case 'pulsadorNA':add(c,'a','b',c.pressed?1e6:1e-12,null);break;
      case 'conmutador':add(c,'c',c.pos?'1':'0',1e6,null);un(gp,K(c,'c'),K(c,'0'));un(gp,K(c,'c'),K(c,'1'));break;
      case 'conmutador2':{const p=c.pos?'1':'0';add(c,'c1',p+'a',1e6,null);add(c,'c2',p+'b',1e6,null);
        ['0a','1a'].forEach(t=>un(gp,K(c,'c1'),K(c,t)));['0b','1b'].forEach(t=>un(gp,K(c,'c2'),K(c,t)));un(gp,K(c,'c1'),K(c,'c2'));break;}
    }
  });
  const gset=new Set(),gdone=new Set();
  b.comps.filter(c=>c.type==='pila').sort((x,y)=>x.id-y.id).forEach(c=>{
    const g=fd(gp,K(c,'a'));if(!gdone.has(g)){gdone.add(g);gset.add(fd(par,K(c,'b')));}});
  const roots=new Map();let n=0;
  for(let i=0;i<par.length;i++){const r=fd(par,i);if(!gset.has(r)&&!roots.has(r))roots.set(r,n++);}
  const row=i=>{const r=fd(par,i);return gset.has(r)?-1:roots.get(r);};
  const A=Array.from({length:n},()=>new Float64Array(n)),z=new Float64Array(n);
  for(let i=0;i<n;i++)A[i][i]+=1e-9;
  els.forEach(e=>{
    const ra=row(e.a),rb=row(e.b);if(ra===rb)return;
    if(ra>=0)A[ra][ra]+=e.g;if(rb>=0)A[rb][rb]+=e.g;
    if(ra>=0&&rb>=0){A[ra][rb]-=e.g;A[rb][ra]-=e.g;}
    if(e.E!==null){const I=e.E*e.g;if(ra>=0)z[ra]+=I;if(rb>=0)z[rb]-=I;}
  });
  const x=n?gauss(A,z):new Float64Array(0);
  const res={vd:{},cur:{},br:{},rpm:{},group:{},shortG:{},short:false};
  const V=i=>{if(!x)return 0;const r=row(i);return r<0?0:x[r];};
  els.forEach(e=>{res.vd[e.c.id]=V(e.a)-V(e.b);});
  b.comps.forEach(c=>{
    res.group[c.id]=fd(gp,K(c,Object.keys(tmap(c))[0]));
    const v=res.vd[c.id]||0;
    if(c.type==='lampara')res.br[c.id]=c.burnt?0:Math.min(1,Math.sqrt(v*v/Math.max(+c.value||30,1e-6)/LAMP_P0));
    if(c.type==='motor')res.rpm[c.id]=v*K_RPM;
    if(c.type==='pila'){const I=((+c.value)-v)*1e4;res.cur[c.id]=I;if(Math.abs(I)>50){res.shortG[res.group[c.id]]=true;res.short=true;}}
  });
  return res;
}
function simulate(b){
  for(let pass=0;pass<4;pass++){
    const r=sim1(b);let again=false;
    b.comps.forEach(c=>{if(c.type==='lampara'&&!c.burnt&&Math.abs(r.vd[c.id]||0)>(+c.vmax||12)+1e-6){c.burnt=true;again=true;}});
    if(!again)return r;
  }
  return sim1(b);
}
function mixColor(c1,c2,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const a=p(c1),b=p(c2);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
const conducting=c=>c.type==='interruptor'?!!c.closed:c.type==='pulsadorNA'?!!c.pressed:false;
/* ---------- símbolos ---------- */
function prims(c,res){
  const P=[];
  const L=(x1,y1,x2,y2,w)=>P.push({k:'l',x1,y1,x2,y2,w});
  const T=(x,y,t,sz,bold)=>P.push({k:'t',x,y,t,sz,bold});
  const C=(cx,cy,r,f,ns)=>P.push({k:'c',cx,cy,r,f,ns});
  const G=(pts,f)=>P.push({k:'p',pts,f});
  const pole=(yo,pos)=>{
    L(-40,yo,-14,yo);L(14,yo-20,40,yo-20);L(14,yo+20,40,yo+20);
    C(-14,yo,3.5,INK);C(14,yo-20,3.5,'#fff');C(14,yo+20,3.5,'#fff');
    L(-14,yo,12,yo+(pos?17:-17),3);
  };
  switch(c.type){
    case 'pila':L(-40,0,-6,0);L(-6,-16,-6,16,3.5);L(6,-9,6,9,3.5);L(6,0,40,0);T(-31,-8,'+',14,true);T(31,-8,'-',16,true);break;
    case 'lampara':{
      const br=(res&&res.br&&res.br[c.id])||0;
      if(br>0.04)C(0,0,17+br*10,mixColor('#ffffff','#ffe680',br),true);
      L(-40,0,-16,0);L(16,0,40,0);C(0,0,16,c.burnt?'#8b929a':mixColor('#eceff2','#ffd21f',br));L(-11,-11,11,11);L(-11,11,11,-11);break;}
    case 'motor':
      L(-40,0,-18,0);L(18,0,40,0);C(0,0,18,'#fff');T(0,6,'M',17,true);T(-31,-8,'+',13,true);T(31,-8,'-',15,true);
      P.push({k:'r',rpm:(res&&res.rpm&&res.rpm[c.id])||0,id:c.id});break;
    case 'interruptor':case 'pulsadorNA':{
      L(-40,0,-14,0);L(14,0,40,0);C(-14,0,3.5,'#fff');C(14,0,3.5,'#fff');
      const on=conducting(c);on?L(-14,0,14,0,3):L(-14,0,12,-15,3);
      if(c.type==='pulsadorNA'){const d=c.pressed?5:0;L(-8,-24+d,8,-24+d,3.5);L(0,-24+d,0,on?-3:-7,2);}
      break;}
    case 'conmutador':{
      L(-40,0,-14,0);L(14,-20,40,-20);L(14,20,40,20);C(-14,0,3.5,INK);C(14,-20,3.5,'#fff');C(14,20,3.5,'#fff');
      L(-14,0,12,c.pos?17:-17,3);T(27,-26,'0',11);T(27,36,'1',11);break;}
    case 'conmutador2':{
      pole(-40,c.pos);pole(40,c.pos);
      for(let y=-30;y<30;y+=14)L(-14,y,-14,y+7,1.5);
      T(27,-66,'0',11);T(27,-8,'1',11);T(27,14,'0',11);T(27,76,'1',11);break;}
  }
  return P;
}
const nameOf=(b,c)=>{const n=b.comps.filter(x=>x.type===c.type).indexOf(c)+1;return TYPES[c.type].name+(['lampara','motor','pila'].includes(c.type)?' '+n:'');};
const rpmTxt=r=>Math.abs(r)<1?'parado':Math.round(Math.abs(r))+' rpm ('+(r>0?'horario':'antihorario')+')';
function labelLines(b,c,res){
  switch(c.type){
    case 'pila':return[{t:'Pila · '+fmtNum(c.value)+' V'}];
    case 'lampara':return c.burnt?[{t:'¡FUNDIDA!',cls:'rv'}]:[{t:'Lámpara'}];
    case 'motor':return[{t:'Motor'},{t:rpmTxt(res.rpm[c.id]||0),cls:'ra'}];
    case 'interruptor':return[{t:'Interruptor'+(c.closed?' (cerrado)':' (abierto)')}];
    case 'pulsadorNA':return[{t:'Pulsador'+(c.pressed?' (pulsado)':'')}];
    default:return[{t:TYPES[c.type].name+' · pos. '+(c.pos?1:0)}];
  }
}
function labelPlace(c,L){
  const h=((c.rot||0)%180)===0,n=L.length,hh=HH[c.type]||28;
  return L.map((l,i)=>h?Object.assign({},l,{x:c.x,y:c.y-hh-6-(n-1-i)*17,a:'middle'}):Object.assign({},l,{x:c.x+hh+4,y:c.y-((n-1)*17)/2+i*17+5,a:'start'}));
}

/* ---------- análisis por circuitos y verificación ---------- */
function analyze(b){
  const res=simulate(b),map=new Map();
  b.comps.forEach(c=>{
    const g=res.group[c.id];
    if(!map.has(g))map.set(g,{ids:[],n:{},pilas:[],short:!!res.shortG[g]});
    const G=map.get(g);G.ids.push(c.id);G.n[c.type]=(G.n[c.type]||0)+1;
    if(c.type==='pila')G.pilas.push(+c.value);
  });
  return{groups:[...map.values()],res};
}
function runG(b,G,set){
  const cl=JSON.parse(JSON.stringify(b));
  cl.comps.forEach(c=>{if(c.type==='lampara')c.burnt=false;});
  const ids=new Set(G.ids),mine=t=>cl.comps.filter(c=>ids.has(c.id)&&c.type===t).sort((x,y)=>x.id-y.id);
  Object.keys(set||{}).forEach(t=>mine(t).forEach((c,i)=>{
    const v=Array.isArray(set[t])?set[t][i]:set[t];
    if(t==='interruptor')c.closed=!!v;else if(t==='pulsadorNA')c.pressed=!!v;else c.pos=v?1:0;}));
  const res=simulate(cl),lamps=mine('lampara'),motors=mine('motor');
  const lit=lamps.filter(c=>res.br[c.id]>0.12);
  return{br:lamps.map(c=>res.br[c.id]),burnt:lamps.filter(c=>c.burnt).length,litIds:lit.map(c=>c.id),lit:lit.length,
    rpm:motors.map(c=>res.rpm[c.id]),run:motors.filter(c=>Math.abs(res.rpm[c.id])>20).length,short:!!res.shortG[res.group[G.ids[0]]]};
}
function sigMatch(G,sp){
  for(const k of new Set([...Object.keys(G.n),...Object.keys(sp.n)]))if((G.n[k]||0)!==(sp.n[k]||0))return false;
  if(sp.v){const a=G.pilas.slice().sort((x,y)=>x-y),e=sp.v.slice().sort((x,y)=>x-y);if(a.length!==e.length||a.some((x,i)=>Math.abs(x-e[i])>1e-9))return false;}
  return true;
}
const PL={pila:['pila','pilas'],lampara:['lámpara','lámparas'],motor:['motor','motores'],interruptor:['interruptor','interruptores'],pulsadorNA:['pulsador','pulsadores'],conmutador:['conmutador','conmutadores'],conmutador2:['conmutador doble','conmutadores dobles']};
function descr(sp){
  return Object.keys(sp.n).map(t=>sp.n[t]+' '+PL[t][sp.n[t]>1?1:0]).join(', ')+(sp.v?' (pilas de '+sp.v.map(fmtNum).join(' V y ')+' V)':'');
}
function verifyBoard(key){
  const b=S.boards[key],specs=SPECS[key];
  if(!b.comps.length)return{ok:false,msgs:['El área de trabajo está vacía.']};
  const A=analyze(b),used=new Set(),msgs=[];
  specs.forEach(sp=>{
    const cands=A.groups.map((G,i)=>i).filter(i=>!used.has(i)&&sigMatch(A.groups[i],sp));
    if(!cands.length){msgs.push('Falta o no coincide el circuito «'+sp.name+'»: debe llevar '+descr(sp)+', conectados entre sí.');return;}
    let first=null,done=false;
    for(const i of cands){
      const m=sp.test(set=>runG(b,A.groups[i],set));
      if(!m.length){used.add(i);done=true;break;}
      if(!first)first=m;
    }
    if(!done)msgs.push('«'+sp.name+'»: '+first.join(' '));
  });
  if(!msgs.length&&A.groups.length>specs.length)msgs.push('Hay componentes o circuitos de más: deja solo los que pide el ejercicio.');
  return msgs.length?{ok:false,msgs}:{ok:true,msgs:['Montaje correcto: todos los circuitos funcionan como pide el ejercicio.']};
}

function loopS(p,x0,y0,v,items,rev){

  items.forEach((t,i)=>{const id=p.add(t,x0+140+i*120,y0,0);p.w(prev,id+'.a');prev=id+'.b';});

function revTest(r,o){

    const pos=run.filter(q=>q.x.rpm[0]>0),neg=run.filter(q=>q.x.rpm[0]<0);

    if(o.strict){

    }

      run.forEach(q=>{if(q.x.lit!==1)m.push('Con los conmutadores en '+q.c.join('-')+' debe encenderse una sola bombilla (ahora '+q.x.lit+').');});
      if(!m.length&&pos[0].x.litIds[0]===neg[0].x.litIds[0])m.push('La bombilla encendida debe ser distinta según el sentido de giro.');
      if(!m.length&&o.noburn&&run.some(q=>q.x.burnt))m.push('Alguna bombilla se funde: revisa las conexiones.');
    }

  }
  const key=o.key||'conmutador',a=r({[key]:0}),b=r({[key]:1});

    m.push('El motor debe girar en un sentido en una posición del conmutador y en sentido contrario en la otra.');
  if(o.big&&!m.length&&(Math.abs(a.rpm[0])<800||Math.abs(b.rpm[0])<800))m.push('El motor debe recibir los 9 V completos en cada posición (revisa el montaje).');
  if(o.lamps&&!m.length){

function statusOf(f){
  const v=S.ans[f.id];
  if(f.type==='text')return(v||'').trim().length>=8?'text':'empty';
  if(f.type==='sel')return!v?'empty':v===f.ok?'ok':'bad';
  if(!v||!String(v).trim())return'empty';
  const n=parseNum(v);if(isNaN(n))return'bad';
  return Math.abs(Math.abs(n)-f.exp)<=Math.max(3,f.exp*0.04)?'ok':'bad';
}
function evaluate(){
  let ok=0,total=0;const pend=[],rows=[];
  BLOCKS.forEach(bl=>{
    const ver=verifyBoard(bl.k),items=bl.fields.map(f=>({f,st:statusOf(f)}));
    items.forEach(i=>{if(i.f.type!=='text'){total++;if(i.st==='ok')ok++;}if(i.st==='empty')pend.push(bl.title.split(' · ')[0]+': '+i.f.label);});
    if(!ver.ok)pend.push(bl.title.split(' · ')[0]+': montaje sin verificar');
    rows.push({bl,ver,items});
  });
  return{rows,ok,total,pend};
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(16).toUpperCase().padStart(8,'0');}
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function pdfName(){return['montajes_electricos',slug(S.names.n1),slug(S.names.n2),slug(S.names.group)].filter(Boolean).join('_')+'.pdf';}
function drawBoard(d,b,w,h){
  d.ensure(h+8);
  const x=d.M,y=d.y;
  d.rect(x,y,w,h,{stroke:'#c5d0dc',lw:0.8,fill:'#fbfcfe'});
  if(!b.comps.length){d.text(x+w/2,y+h/2,'(montaje vacio)',{align:'center',color:'#888888',size:10});d.y+=h+8;return;}
  const res=simulate(b);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  b.comps.forEach(c=>Object.keys(tmap(c)).forEach(t=>{const p=termPos(c,t);x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}));
  x0-=30;x1+=70;y0-=58;y1+=30;
  const sc=Math.min((w-14)/(x1-x0),(h-10)/(y1-y0),1),ox=x+w/2-((x0+x1)/2)*sc,oy=y+h/2-((y0+y1)/2)*sc;
  const X=v=>ox+v*sc,Y=v=>oy+v*sc;
  b.wires.forEach(wi=>{const p=wirePts(b,wi);if(!p)return;for(let i=0;i<p.length-1;i++)d.line(X(p[i].x),Y(p[i].y),X(p[i+1].x),Y(p[i+1].y),{w:2*sc+0.4});});
  b.comps.forEach(c=>{
    const T=(px,py)=>{const v=rotVec(px,py,c.rot||0);return[X(c.x+v[0]),Y(c.y+v[1])];};
    prims(c,res).forEach(p=>{
      if(p.k==='l'){const a=T(p.x1,p.y1),e=T(p.x2,p.y2);d.line(a[0],a[1],e[0],e[1],{w:(p.w||2)*sc+0.3});}
      else if(p.k==='p')d.poly(p.pts.map(q=>T(q[0],q[1])),{fill:p.f,lw:sc+0.3});
      else if(p.k==='c'){const m=T(p.cx,p.cy);d.circle(m[0],m[1],p.r*sc,{fill:p.f,lw:sc+0.3,ns:p.ns});}
      else if(p.k==='t'){const m=T(p.x,p.y);d.text(m[0],m[1]+p.sz*sc*0.3,p.t,{size:Math.max(5.5,p.sz*sc),bold:p.bold,align:'center'});}
    });
    labelPlace(c,labelLines(b,c,res)).forEach(l=>d.text(X(l.x),Y(l.y),l.t,{size:Math.max(6.5,12*sc),bold:!!l.cls,align:l.a==='middle'?'center':'left',color:l.cls==='ra'?'#0b5cad':l.cls==='rv'?'#c0392b':'#142133'}));
  });
  d.y+=h+8;
}

function sanitizeBoard(o){
  if(!o||!Array.isArray(o.comps)||!Array.isArray(o.wires))return null;
  const comps=o.comps.filter(c=>TYPES[c.type]&&isFinite(c.x)&&isFinite(c.y)).map(c=>({id:+c.id,type:c.type,x:+c.x,y:+c.y,rot:+c.rot||0,
    value:isFinite(c.value)?+c.value:TYPES[c.type].def,closed:!!c.closed,pressed:false,pos:c.pos?1:0,vmax:isFinite(c.vmax)&&c.vmax>0?+c.vmax:12,burnt:!!c.burnt}));
  const ids=new Set(comps.map(c=>c.id));
  const wires=o.wires.filter(w=>w&&typeof w.a==='string'&&typeof w.b==='string'&&ids.has(parseKey(w.a).id)&&ids.has(parseKey(w.b).id)).map(w=>({a:w.a,b:w.b}));
  return{comps,wires,nid:Math.max(0,...comps.map(c=>c.id))+1};
}
function load(){

}

  const f=n=>Math.round(n*100)/100;

    case 'c':return '<circle cx="'+p.cx+'" cy="'+p.cy+'" r="'+p.r+'" fill="'+(p.f||'none')+'" stroke="'+(p.ns?'none':INK)+'" stroke-width="2"/>';
    case 't':return '<text x="'+p.x+'" y="'+p.y+'" font-size="'+p.sz+'" font-weight="'+(p.bold?700:400)+'" text-anchor="middle" fill="'+INK+'" font-family="system-ui,sans-serif" transform="rotate('+f(-rot)+' '+p.x+' '+p.y+')">'+esc(p.t)+'</text>';
    case 'r':{const k=key+':'+p.id;return '<g class="rotor" data-k="'+k+'" data-rpm="'+f(p.rpm)+'" transform="rotate('+(ANG[k]||0)+')"><line x1="0" y1="-16" x2="0" y2="-10" stroke="#b3541e" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="10" x2="0" y2="16" stroke="#b3541e" stroke-width="3" stroke-linecap="round"/></g>';}
  }

}
function boardSVG(key,b,res,o){
  o=o||{};

  if(!o.readonly)s+='<defs><pattern id="grid-'+key+'" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cfd8e3"/></pattern></defs><rect width="'+size[0]+'" height="'+size[1]+'" fill="url(#grid-'+key+')"/>';
  const conn=new Set();
  b.wires.forEach((w,i)=>{
    const pts=wirePts(b,w);if(!pts)return;conn.add(w.a);conn.add(w.b);

    s+='<polyline class="wire'+(o.selWire===i?' sel':'')+'" points="'+d+'"/>';
    if(!o.readonly)s+='<polyline class="wirehit" data-wire="'+i+'" points="'+d+'"/>';
  });

    const r=c.rot||0,hh=HH[c.type]||28;

    if(!o.readonly)s+='<rect class="hit" data-comp="'+c.id+'" x="-28" y="'+(-hh)+'" width="56" height="'+(2*hh)+'"/>';
    if(o.sel===c.id)s+='<rect class="selbox" x="-34" y="'+(-hh-4)+'" width="68" height="'+(2*hh+8)+'" rx="8"/>';
    s+='</g>';
    labelPlace(c,labelLines(b,c,res)).forEach(l=>{
      s+='<text class="lbl'+(l.cls?' '+l.cls:'')+'" x="'+l.x+'" y="'+l.y+'" text-anchor="'+l.a+'">'+esc(l.t)+'</text>';
    });
  });
  b.comps.forEach(c=>Object.keys(tmap(c)).forEach(t=>{
    const p=termPos(c,t),k=c.id+'.'+t;
    s+='<circle class="termdot'+(conn.has(k)?' con':'')+(o.wire===k?' act':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="'+(o.readonly?3.5:5.5)+'"/>';
    if(!o.readonly)s+='<circle class="termhit" data-term="'+k+'" cx="'+p.x+'" cy="'+p.y+'" r="'+(HH[c.type]?9:12)+'"/>';
  }));
  if(o.wire){
    const A=parseKey(o.wire),ca=getComp(b,A.id);
    if(ca){const p=termPos(ca,A.t);s+='<line class="prev" x1="'+p.x+'" y1="'+p.y+'" x2="'+UI.mouse.x+'" y2="'+UI.mouse.y+'"/>';}
  }
  return s;
}
function iconSVG(t){

function touch(key){persist();const v=$('#ver-'+key);if(v){v.className='verify';v.innerHTML='';}}
function addComp(key,type){
  const b=S.boards[key],bl=BL(key);
  if(b.comps.filter(c=>c.type===type).length>=LIMITS[key][type])return;
  let spot=[140,100];
  outer:for(let y=100;y<bl.size[1]-60;y+=100)for(let x=100;x<bl.size[0]-60;x+=120){
    if(!b.comps.some(c=>Math.hypot(c.x-x,c.y-y)<(HH[c.type]||0)+80)){spot=[x,y];break outer;}
  }
  const c={id:b.nid++,type,x:spot[0],y:spot[1],rot:0,value:TYPES[type].def,closed:false,pressed:false,pos:0,vmax:12,burnt:false};
  b.comps.push(c);UI.sel[key]=c.id;UI.selWire[key]=null;UI.wire=null;
  props(key);redraw(key);touch(key);
}
function delComp(key){
  const b=S.boards[key],id=UI.sel[key];if(!id)return;
  b.comps=b.comps.filter(c=>c.id!==id);
  b.wires=b.wires.filter(w=>parseKey(w.a).id!==id&&parseKey(w.b).id!==id);
  UI.sel[key]=null;props(key);redraw(key);touch(key);
}
function rotComp(key){const c=getComp(S.boards[key],UI.sel[key]);if(!c)return;c.rot=((c.rot||0)+90)%360;redraw(key);touch(key);}
function termClick(key,tk){
  const b=S.boards[key];
  if(!UI.wire||UI.wire.key!==key){UI.wire={key,from:tk};UI.sel[key]=null;UI.selWire[key]=null;props(key);redraw(key);return;}
  const a=UI.wire.from;
  if(a!==tk&&!b.wires.some(w=>(w.a===a&&w.b===tk)||(w.a===tk&&w.b===a)))b.wires.push({a,b:tk});
  UI.wire=null;redraw(key);touch(key);
}
const svgPt=(svg,e)=>{const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return{x:(e.clientX-r.left)*vb.width/r.width,y:(e.clientY-r.top)*vb.height/r.height};};
const snap=v=>Math.round(v/SNAP)*SNAP;
function onDown(key,e){
  UI.active=key;const svg=$('#svg-'+key),p=svgPt(svg,e),b=S.boards[key];
  const t=e.target.closest('[data-term]');
  if(t){e.preventDefault();termClick(key,t.dataset.term);return;}
  const ce=e.target.closest('[data-comp]');
  if(ce){
    e.preventDefault();
    const c=getComp(b,+ce.dataset.comp);
    UI.sel[key]=c.id;UI.selWire[key]=null;UI.wire=null;
    UI.drag={key,id:c.id,ox:c.x-p.x,oy:c.y-p.y,sx:p.x,sy:p.y,moved:false};
    if(c.type==='pulsadorNA')c.pressed=true;

  }

}
function onMove(key,e){
  const svg=$('#svg-'+key),p=svgPt(svg,e),bl=BL(key);

    const d=UI.drag,c=getComp(S.boards[key],d.id);if(!c)return;

    if(d.moved){c.x=Math.max(60,Math.min(bl.size[0]-60,snap(p.x+d.ox)));c.y=Math.max(60,Math.min(bl.size[1]-40,snap(p.y+d.oy)));redraw(key);}

function onUp(key){

function initBench(key){

  svg.addEventListener('pointerup',()=>onUp(key));
  svg.addEventListener('pointercancel',()=>onUp(key));
  root.addEventListener('click',e=>{
    UI.active=key;
    const add=e.target.closest('[data-add]');if(add){addComp(key,add.dataset.add);return;}
    const a=e.target.closest('[data-act]');if(!a)return;
    const b=S.boards[key];
    switch(a.dataset.act){
      case 'rot':rotComp(key);break;
      case 'del':delComp(key);break;
      case 'delwire':b.wires.splice(UI.selWire[key],1);UI.selWire[key]=null;props(key);redraw(key);touch(key);break;
      case 'toggle':{const c=getComp(b,UI.sel[key]);if(c){if(c.type==='interruptor')c.closed=!c.closed;else c.pos=c.pos?0:1;props(key);redraw(key);touch(key);}break;}
      case 'fix':{const c=getComp(b,UI.sel[key]);if(c){c.burnt=false;props(key);redraw(key);touch(key);}break;}
      case 'clear':if(b.comps.length&&!confirm('¿Vaciar todo el montaje?'))break;S.boards[key]=newBoard();UI.sel[key]=null;UI.selWire[key]=null;UI.wire=null;props(key);redraw(key);touch(key);break;
      case 'verify':showVerify(key);break;
      case 'copy':{
        if(b.comps.length&&!confirm('Se sustituirá el montaje actual por una copia del ejercicio anterior. ¿Continuar?'))break;
        const nb=sanitizeBoard(JSON.parse(JSON.stringify(S.boards[bl.copyFrom])));
        if(nb){nb.comps.forEach(c=>{c.burnt=false;});S.boards[key]=nb;UI.sel[key]=null;UI.selWire[key]=null;props(key);redraw(key);touch(key);}break;}
      case 'save':download('montaje_'+key+'_'+(slug(S.names.n1)||'alumno')+'.json',JSON.stringify({tipo:'montaje-ies-comuneros',key,board:b},null,1),'application/json');break;
      case 'open':$('#file-'+key).click();break;
    }
  });
  root.addEventListener('input',e=>{
    const c=getComp(S.boards[key],UI.sel[key]),v=parseFloat(e.target.value);
    if(!c||!isFinite(v)||v<=0)return;
    if(e.target.id==='pv-'+key){c.value=v;redraw(key);touch(key);}
    else if(e.target.id==='pm-'+key){c.vmax=v;redraw(key);touch(key);}
  });
  $('#file-'+key).addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result),nb=sanitizeBoard(o.board||o);if(!nb)throw 0;S.boards[key]=nb;UI.sel[key]=null;UI.selWire[key]=null;props(key);redraw(key);touch(key);}catch(x){alert('No se ha podido abrir ese archivo de montaje.');}};
    r.readAsText(f);e.target.value='';
  });
  const dt=root.querySelector('details.schem');
  if(dt)dt.addEventListener('toggle',ev=>{
    if(!ev.target.open)return;
    const pb=PRESETS[key](),pv=$('#prev-'+key);
    pv.innerHTML=boardSVG('prev'+key,pb,simulate(pb),{readonly:true});
  });
  props(key);redraw(key);
}

    '<div class="props" id="props-'+k+'"></div><div class="verify" id="ver-'+k+'" role="status"></div>'+
    (PRESETS[k]?'<details class="schem"><summary>Ver esquema de ayuda</summary><svg class="board" id="prev-'+k+'" viewBox="0 0 '+bl.size[0]+' '+bl.size[1]+'"></svg></details>':'')+
    (bl.fields.length?'<div class="ex-fields"><h4>Hoja de respuestas</h4>'+bl.fields.map(fieldHTML).join('')+'<p><button class="primary" data-check="'+k+'">Comprobar respuestas</button></p><div class="sumline" id="sum-'+k+'"></div></div>':'')+
    '</div>';
}
function datosHTML(){
  return '<div class="card"><h2>Bienvenido al laboratorio virtual</h2><p>Aquí montarás los circuitos de la actividad <b>«Montajes eléctricos»</b> (ejercicios 1 a 20), probarás cómo funcionan y contestarás a las preguntas. Al terminar descargarás un <b>PDF</b> con tu nombre y grupo para entregar a tu profesor.</p>'+
  '<div class="grid2"><div class="field"><label for="n1">Nombre y apellidos (alumno 1) *</label><input class="txt" id="n1" autocomplete="name"></div>'+
  '<div class="field"><label for="n2">Nombre y apellidos (alumno 2)</label><input class="txt" id="n2"></div>'+
  '<div class="field"><label for="grp">Grupo *</label><input class="txt" id="grp" placeholder="Ej.: 3º ESO A"></div></div>'+
  '<p style="margin-top:14px"><button class="primary big" data-go="t1">Empezar →</button></p></div>'+
  '<div class="card"><h3>Cómo se usa el simulador</h3><ol class="steps">'+
  '<li><b>Añade componentes</b> pulsando en la lista de cada ejercicio y arrástralos (se ajustan a la cuadrícula). Cada ejercicio ofrece solo los componentes que necesitas.</li>'+
  '<li><b>Conéctalos con cables</b>: pulsa en un círculo (terminal) y después en otro. Pulsa sobre un cable para seleccionarlo y bórralo con «Supr».</li>'+
  '<li><b>Pilas</b>: selecciónala para cambiar su tensión (9 V, 4,5 V, 1,5 V…). El terminal <b>+</b> es el marcado; «Girar» solo cambia la posición, lo que importa es a qué terminal conectas cada cable.</li>'+
  '<li><b>Interruptor y conmutadores</b>: haz clic para cambiarlos de posición. <b>Pulsador</b>: mantén el botón del ratón pulsado sobre él.</li>'+
  '<li><b>Motor</b>: muestra su velocidad en rpm y su sentido de giro (horario o antihorario); gira más deprisa cuanta más tensión recibe.</li>'+
  '<li><b>Lámparas</b>: brillan más cuanta más tensión reciben. Si superan su tensión máxima (12 V) <b>se funden</b>; puedes cambiarla por otra o aumentar su tensión máxima.</li>'+
  '<li><b>Cortocircuito</b>: si un cable une directamente los dos polos de una pila, el simulador lo avisa. ¡No lo hagas en un circuito real!</li>'+
  '<li>Pulsa <b>Comprobar montaje</b> para saber si tu circuito está bien hecho y <b>Comprobar respuestas</b> para revisar lo contestado. Los textos los corrige tu profesor.</li>'+
  '<li>En «Entrega» descarga el <b>PDF</b>. Tu trabajo se guarda en este navegador, pero descarga el PDF antes de cerrar.</li></ol></div>';
}
function refreshMarks(k){
  const bl=BL(k),lab={ok:'✔ Correcto',bad:'✘ Revisa',empty:'· Falta',text:'✔ Anotado'};
  bl.fields.forEach(f=>{
    const m=document.querySelector('[data-mark="'+f.id+'"]');if(!m)return;
    if(!S.checked[k]){m.textContent='';m.className='mark';return;}
    const st=statusOf(f);m.textContent=lab[st];m.className='mark '+st;
  });
  const el=$('#sum-'+k);if(!el)return;
  const its=bl.fields.filter(f=>f.type!=='text'),ok=its.filter(f=>statusOf(f)==='ok').length;
  if(S.checked[k]&&its.length)el.innerHTML='Has acertado <span class="'+(ok===its.length?'ok-t':'bad-t')+'">'+ok+' de '+its.length+'</span> apartados comprobables. '+(ok<its.length?'Repasa las marcadas con ✘ probando de nuevo en el simulador. ':'¡Muy bien! ')+'Los textos los revisará tu profesor.';
  else if(S.checked[k])el.textContent='Los textos los revisará tu profesor.';
  else el.textContent='';
}
function bindAnswers(){
  $$('[data-ans]').forEach(el=>{
    const id=el.dataset.ans;el.value=S.ans[id]||'';
    el.addEventListener('input',()=>{S.ans[id]=el.value;persist();});
    el.addEventListener('change',()=>{S.ans[id]=el.value;persist();});
  });
}
function renderFinal(){
  const ev=evaluate(),okN=S.names.n1.trim()&&S.names.group.trim();
  let h='<div class="card"><h2>Entrega · Hoja de respuestas en PDF</h2>';
  h+='<p><b>Alumno/s:</b> '+esc([S.names.n1,S.names.n2].filter(Boolean).join(' y ')||'—')+' · <b>Grupo:</b> '+esc(S.names.group||'—')+' <button data-go="datos">Editar datos</button></p>';
  if(!okN)h+='<p class="bad-t">Rellena al menos el nombre del alumno 1 y el grupo para poder descargar el PDF.</p>';
  h+='<table class="res"><tr><th>Ejercicio</th><th>Montaje</th><th>Respuestas</th></tr>';
  ev.rows.forEach(r=>{
    const its=r.items.filter(i=>i.f.type!=='text'),ok=its.filter(i=>i.st==='ok').length;
    h+='<tr><td>'+esc(r.bl.title)+'</td><td>'+(r.ver.ok?'<span class="ok-t">✔ Verificado</span>':'<span class="bad-t">Sin verificar</span>')+'</td><td>'+(its.length?ok+' / '+its.length:'—')+'</td></tr>';
  });
  h+='</table>';
  if(ev.pend.length)h+='<h4>Pendiente de completar</h4><ul class="pend">'+ev.pend.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';
  else h+='<p class="ok-t">¡Todo completado!</p>';
  h+='<p><button class="primary big" id="btn-pdf"'+(okN?'':' disabled')+'>Descargar PDF'+(ev.pend.length?' (incompleto)':'')+'</button></p><p class="muted small">Archivo: '+esc(pdfName())+'</p></div>'+
  '<div class="card"><h3>Copia de seguridad</h3><p class="muted small">Guarda todo tu trabajo en un archivo para continuar en otro ordenador.</p><button id="btn-sv">Guardar trabajo (.json)</button> <button id="btn-op">Abrir trabajo</button><input type="file" accept=".json" hidden id="file-all"></div>';
  $('#v-fin').innerHTML=h;
  $('#btn-pdf').onclick=()=>{try{download(pdfName(),buildPDF(),'application/pdf');}catch(e){alert('Error al crear el PDF: '+e.message);}};
  $('#btn-sv').onclick=()=>download('trabajo_'+(slug(S.names.n1)||'alumno')+'.json',JSON.stringify(S),'application/json');
  $('#btn-op').onclick=()=>$('#file-all').click();
  $('#file-all').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const o=JSON.parse(r.result);if(!o.boards||!o.names)throw 0;
      BLOCKS.forEach(bl=>{const nb=sanitizeBoard(o.boards[bl.k]);if(nb)S.boards[bl.k]=nb;});
      S.names=Object.assign(S.names,o.names);S.ans=o.ans||{};persist();location.reload();
    }catch(x){alert('Archivo no válido.');}};r.readAsText(f);
  };
}
function go(v){
  S.view=v;
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
  if(v==='fin')renderFinal();
  BLOCKS.filter(b=>b.tab===v).forEach(b=>redraw(b.k));
  window.scrollTo(0,0);persist();
}
let lastT=0;
function spin(t){
  const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;
  document.querySelectorAll('g.rotor').forEach(g=>{
    const rpm=+g.dataset.rpm;if(Math.abs(rpm)<1)return;
    const k=g.dataset.k;ANG[k]=((ANG[k]||0)+Math.max(-900,Math.min(900,rpm))/60*360*0.18*dt)%360;
    g.setAttribute('transform','rotate('+ANG[k].toFixed(1)+')');
  });
  requestAnimationFrame(spin);
}
function init(){
  load();
  $('#nav').innerHTML='<button data-go="datos">Datos</button>'+TABS.map(t=>'<button data-go="'+t.k+'">'+t.label+'</button>').join('')+'<button data-go="fin">Entrega (PDF)</button>';
  const main=$('#main');
  main.innerHTML='<section class="view" id="v-datos">'+datosHTML()+'</section>'+TABS.map(t=>'<section class="view" id="v-'+t.k+'">'+BLOCKS.filter(b=>b.tab===t.k).map(blockHTML).join('')+'</section>').join('')+'<section class="view" id="v-fin"></section>';
  BLOCKS.forEach(bl=>{initBench(bl.k);refreshMarks(bl.k);});
  bindAnswers();
  [['n1','n1'],['n2','n2'],['grp','group']].forEach(a=>{
    const el=$('#'+a[0]);el.value=S.names[a[1]]||'';
    el.addEventListener('input',()=>{S.names[a[1]]=el.value;persist();});
  });
  document.addEventListener('click',e=>{
    const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
    const c=e.target.closest('[data-check]');if(c){S.checked[c.dataset.check]=true;refreshMarks(c.dataset.check);persist();}
  });
  document.addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    const key=UI.active,bench=$('#bench-'+key);if(!bench||!bench.offsetParent)return;
    if(e.key==='r'||e.key==='R')rotComp(key);
    else if(e.key==='Delete'||e.key==='Backspace'){
      e.preventDefault();
      if(UI.selWire[key]!=null){S.boards[key].wires.splice(UI.selWire[key],1);UI.selWire[key]=null;props(key);redraw(key);touch(key);}
      else delComp(key);
    }else if(e.key==='Escape'){UI.wire=null;redraw(key);}
  });
  go(S.view&&($('#v-'+S.view))?S.view:'datos');
  requestAnimationFrame(spin);
}
init();

</script>
</body>
</html>
